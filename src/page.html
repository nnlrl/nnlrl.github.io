<!doctype html>
<html lang="$page_lang" data-style="memphis">
<!-- Adapted from luost26/academic-homepage; MIT license retained in LICENSE. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#ffdf67">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="$page_title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <title>$page_title</title>
  <link rel="canonical" href="$canonical">
  <link rel="alternate" hreflang="zh-CN" href="https://nnlrl.github.io/">
  <link rel="alternate" hreflang="en" href="https://nnlrl.github.io/en.html">
  <link rel="alternate" hreflang="x-default" href="https://nnlrl.github.io/">
  <link rel="icon" href="assets/images/home-folder-yellow.svg?v=20261030-memphis" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css?v=20261030-memphis">
  <link rel="stylesheet" href="assets/css/site-base.css?v=20261030-memphis">
  <link rel="stylesheet" href="assets/css/memphis.css?v=20261030-memphis">
  <script type="application/ld+json">$structured_data</script>
  <script defer src="assets/js/homepage.js?v=20261030-memphis"></script>
</head>
<body id="top">
  <a class="skip-link" href="#content">$skip</a>
  <header class="topbar"><div class="topbar-inner">
    <a class="home-link" href="#top" aria-label="$home_label">$home_icon<span>$name</span></a>
    <nav class="page-nav" aria-label="$menu">$nav_links</nav>
    <a class="language-link" href="$switch_file" lang="$switch_lang" hreflang="$switch_lang" aria-label="$switch_description">$switch_label</a>
  </div></header>
  <main class="page-grid" id="content">$identity<div class="content-column">$content</div></main>
  <footer class="page-footer">
    <span>© $year $name</span><a href="#top">$back_top</a>
    <span>$template_credit <a href="https://github.com/luost26/academic-homepage" target="_blank" rel="noopener noreferrer">academic-homepage</a> · <a href="LICENSE">MIT</a></span>
  </footer>
</body>
</html>
